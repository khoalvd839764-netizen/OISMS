server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /health { proxy_pass http://backend:8080; }
    location /hubs/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
