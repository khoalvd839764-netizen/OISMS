name: oisms-pos-migration-test
services:
  pg:
    image: postgres:16-alpine
    container_name: oisms_pos_migration_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PosMigrationFixture2026!
      POSTGRES_DB: oisms_pos_migration_test
      OISMS_APP_USER: oisms_pos_migration_app
      OISMS_APP_PASSWORD: PosMigrationAppFixture2026!
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - ../postgres/init-oisms.sh:/docker-entrypoint-initdb.d/01-init-oisms.sh:ro
      - ../../docs/database/oisms_schema.sql:/docker/postgres/oisms_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oisms_pos_migration_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    image: oisms-backend
    container_name: oisms_pos_migration_backend
    ports: ["127.0.0.1:55001:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Host: pg
      Database__Port: "5432"
      Database__Database: oisms_pos_migration_test
      Database__Username: oisms_pos_migration_app
      Database__Password: PosMigrationAppFixture2026!
      Jwt__Secret: OismsPosMigrationFixtureSecretAtLeast32Bytes2026
    depends_on:
      pg: { condition: service_healthy }
  pos:
    image: oisms-pos-migration-frontend-test
    container_name: oisms_pos_migration_frontend
    build:
      context: ../../src/frontend/pos-app
      args:
        VITE_API_BASE_URL: http://localhost:55174
        VITE_ADMIN_URL: http://localhost:5173
    ports: ["127.0.0.1:55174:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
