
services:
  # Database: PostgreSQL 16+
  postgres:
    image: postgres:16-alpine
    container_name: oism_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-oisms}
      OISMS_APP_USER: ${OISMS_APP_USER:-oisms_app}
      OISMS_APP_PASSWORD: "${OISMS_APP_PASSWORD:?Error: OISMS_APP_PASSWORD must be set in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-oisms.sh:/docker-entrypoint-initdb.d/01-init-oisms.sh:ro
      - ./docs/database/oisms_schema.sql:/docker/postgres/oisms_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oisms}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oism_network

  # Cache & Message Broker: Redis
  redis:
    image: redis:7-alpine
    container_name: oism_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - oism_network

  # Database Admin UI (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: oism_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@oisms.local}
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?Error: PGADMIN_PASSWORD must be set in .env}"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oism_network

  # Backend: .NET 8 Web API
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: oism_backend
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__Host: postgres
      Database__Port: "5432"
      Database__Database: ${POSTGRES_DB:-oisms}
      Database__Username: ${OISMS_APP_USER:-oisms_app}
      Database__Password: "${OISMS_APP_PASSWORD:?Error: OISMS_APP_PASSWORD must be set in .env}"
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - oism_network

  # Frontend: Admin Dashboard (React)
  admin-dashboard:
    build:
      context: ./src/frontend/admin-dashboard
      dockerfile: Dockerfile
    container_name: oism_admin_dashboard
    restart: always
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - oism_network

  # Frontend: POS Application (React PWA)
  pos-app:
    build:
      context: ./src/frontend/pos-app
      dockerfile: Dockerfile
    container_name: oism_pos_app
    restart: always
    ports:
      - "${POS_PORT:-5174}:80"
    depends_on:
      - backend
    networks:
      - oism_network

volumes:
  postgres_data:
  redis_data:

networks:
  oism_network:
    driver: bridge
